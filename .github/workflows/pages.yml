name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (inject keys from secrets)
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir _site
          cp index.html app.js duel.js online.js style.css favicon.svg _site/
          # FIREBASE_CONFIG è il JSON di configurazione web di Firebase (opzionale).
          jq -n --arg m "$MAPILLARY_TOKEN" --arg g "$GOOGLE_MAPS_KEY" --arg f "$FIREBASE_CONFIG" \
            '{mapillaryToken: $m, googleKey: $g, firebase: (try ($f | fromjson) catch null)}' \
            | { printf 'window.OMG_CONFIG = '; cat; printf ';\n'; } > _site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
